spring:
  application:
    name: olivia
  datasource:
    url: jdbc:postgresql://localhost:5435/hr_dev
    username: vms
    password: vms_local_dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8092
  error:
    include-message: always

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5177}
  aria:
    # LLM-powered Aria activates only when enabled AND ANTHROPIC_API_KEY is set;
    # otherwise the conversation runs fully offline on the scripted brain.
    enabled: ${ARIA_AI_ENABLED:true}
    model: ${ARIA_MODEL:claude-opus-4-8}
    nlu-model: ${ARIA_NLU_MODEL:claude-opus-4-8}

management:
  endpoints:
    web:
      exposure:
        include: health,info
